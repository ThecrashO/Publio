<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publio - Social Media Publishing Platform</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- CDN Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center text-center">

    <div class="container py-5">
        <div class="mb-3">
            <img src="assets/logo.png" alt="Publio Logo" class="app-logo app-logo-lg mb-2">
        </div>
        <div class="spinner-border text-info mb-3" style="width: 2.5rem; height: 2.5rem;" role="status">
            <span class="visually-hidden">Loading Publio...</span>
        </div>
        <h3 class="brand-text">Publio</h3>
        <p class="text-secondary">Verifying authentication status...</p>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await Auth.getUser();
            if (user) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>

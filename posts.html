<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post History - Publio</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <!-- CDN Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-publio sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <img src="assets/logo.png" alt="Publio Logo" class="app-logo">
                <span class="brand-text fw-bold fs-4">Publio</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active fw-medium" href="posts.html"><i class="bi bi-file-earmark-post me-1"></i> Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="settings.html"><i class="bi bi-gear me-1"></i> Social Settings</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="user-display-name" class="text-secondary small d-none d-sm-inline">...</span>
                    <button id="btn-logout" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container py-4">

        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1">Post History</h2>
                <p class="text-secondary small mb-0">Track publishing results, view platform responses, and retry failures.</p>
            </div>
            <a href="dashboard.html#create-post-card" class="btn btn-publio-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i> Create Post
            </a>
        </div>

        <div id="posts-alert-container"></div>

        <!-- FILTER TABS -->
        <div class="card card-publio mb-4">
            <div class="card-header card-header-publio border-0 p-2">
                <ul class="nav nav-pills nav-justified" id="status-filter-tabs">
                    <li class="nav-item">
                        <button class="nav-link active fw-semibold btn-sm filter-btn" data-filter="all">All Posts</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link fw-semibold btn-sm filter-btn text-success" data-filter="published">Published</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link fw-semibold btn-sm filter-btn text-secondary" data-filter="draft">Drafts</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link fw-semibold btn-sm filter-btn text-danger" data-filter="failed">Failed</button>
                    </li>
                </ul>
            </div>
        </div>

        <!-- POSTS LIST -->
        <div id="posts-list-container" class="row g-3">
            <div class="col-12 text-center py-5 text-secondary">
                <div class="spinner-border text-info mb-3" role="status"></div>
                <p>Loading posts history...</p>
            </div>
        </div>

    </div>

    <!-- POST DETAILS MODAL -->
    <div class="modal fade" id="postDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content bg-dark border-secondary text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold" id="modal-post-title">Post Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div id="modal-post-content">
                        <!-- Populated by JS -->
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/posts.js"></script>
    <script>
        let currentUser = null;
        let allPosts = [];
        let activeFilter = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await Auth.requireAuth();
            if (!currentUser) return;

            document.getElementById('user-display-name').textContent = currentUser.email;
            document.getElementById('btn-logout').addEventListener('click', () => Auth.signOut());

            // Load Posts
            await fetchAndRenderPosts();

            // Filter Tabs listener
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    activeFilter = e.target.dataset.filter;
                    renderPostsList();
                });
            });
        });

        async function fetchAndRenderPosts() {
            allPosts = await Posts.getUserPosts(currentUser.id, 100);
            renderPostsList();
        }

        function renderPostsList() {
            const container = document.getElementById('posts-list-container');

            let filtered = allPosts;
            if (activeFilter !== 'all') {
                filtered = allPosts.filter(p => p.status === activeFilter);
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5 text-secondary">
                        <i class="bi bi-file-earmark-x fs-1 d-block mb-2 opacity-50"></i>
                        <h5>No ${activeFilter !== 'all' ? activeFilter : ''} posts found</h5>
                        <p class="small">Create your first post from the dashboard.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(post => {
                const statusBadge = Utils.renderStatusBadge(post.status);
                const formattedDate = Utils.formatDate(post.created_at);
                const captionSnippet = Utils.truncateText(post.caption, 120);

                const platformBadges = (post.post_platforms || []).map(pp => {
                    const pConfig = Utils.getPlatformConfig(pp.platform);
                    const pStatusBadge = pp.status === 'published' 
                        ? '<span class="badge bg-success extra-small"><i class="bi bi-check"></i></span>'
                        : (pp.status === 'failed' ? '<span class="badge bg-danger extra-small"><i class="bi bi-x"></i></span>' : '<span class="badge bg-warning text-dark extra-small">Pending</span>');

                    return `<span class="badge bg-dark border border-secondary text-white d-inline-flex align-items-center gap-1">
                        <i class="bi ${pConfig.icon}" style="color:${pConfig.color}"></i> ${pConfig.name} ${pStatusBadge}
                    </span>`;
                }).join(' ');

                return `
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="card card-publio h-100 d-flex flex-column">
                            ${post.image_url ? `
                                <img src="${Utils.escapeHtml(post.image_url)}" class="card-img-top object-fit-cover" style="height: 180px;" alt="Post Media">
                            ` : ''}
                            <div class="card-body d-flex flex-column flex-grow-1 p-3">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    ${statusBadge}
                                    <span class="extra-small text-secondary"><i class="bi bi-clock me-1"></i>${formattedDate}</span>
                                </div>
                                <p class="card-text text-white small flex-grow-1 mb-3">${Utils.escapeHtml(captionSnippet)}</p>
                                
                                <div class="mb-3 d-flex flex-wrap gap-1">
                                    ${platformBadges || '<span class="extra-small text-muted">No platforms assigned</span>'}
                                </div>

                                <div class="d-flex gap-2 border-top border-secondary pt-2 mt-auto">
                                    ${post.status === 'draft' || post.status === 'failed' ? `
                                        <a href="dashboard.html?edit=${post.id}" class="btn btn-sm btn-outline-warning w-50">
                                            <i class="bi bi-pencil me-1"></i> Edit
                                        </a>
                                    ` : `
                                        <a href="dashboard.html?reuse=${post.id}" class="btn btn-sm btn-outline-success w-50">
                                            <i class="bi bi-arrow-repeat me-1"></i> Reuse
                                        </a>
                                    `}
                                    <button type="button" class="btn btn-sm btn-outline-info w-50" onclick="openDetailsModal('${post.id}')">
                                        <i class="bi bi-eye me-1"></i> Details
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="deletePost('${post.id}')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openDetailsModal = function(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const modalContent = document.getElementById('modal-post-content');
            const platformResults = (post.post_platforms || []).map(pp => {
                const pConfig = Utils.getPlatformConfig(pp.platform);
                const isFailed = pp.status === 'failed';

                return `
                    <div class="card bg-dark border-secondary p-3 mb-2">
                        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi ${pConfig.icon} fs-4" style="color: ${pConfig.color}"></i>
                                <span class="fw-bold text-white">${pConfig.name}</span>
                            </div>
                            <div>
                                ${Utils.renderStatusBadge(pp.status)}
                            </div>
                        </div>
                        ${pp.platform_post_id ? `
                            <div class="mt-2 extra-small text-secondary">
                                <strong>Platform Post ID / Msg ID:</strong> <code>${Utils.escapeHtml(pp.platform_post_id)}</code>
                            </div>
                        ` : ''}
                        ${pp.error_message ? `
                            <div class="mt-2 alert alert-danger py-2 extra-small mb-0">
                                <strong>Error:</strong> ${Utils.escapeHtml(pp.error_message)}
                            </div>
                        ` : ''}
                        ${isFailed ? `
                            <div class="mt-2 text-end">
                                <button type="button" class="btn btn-sm btn-warning text-dark fw-semibold" onclick="retryPlatformPublish('${post.id}', '${pp.platform}')">
                                    <i class="bi bi-arrow-clockwise me-1"></i> Retry ${pConfig.name}
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');

            modalContent.innerHTML = `
                <div class="mb-3">
                    <span class="text-secondary small fw-semibold text-uppercase d-block mb-1">Post Status & Date</span>
                    <div class="d-flex align-items-center gap-2">
                        ${Utils.renderStatusBadge(post.status)}
                        <span class="small text-secondary">${Utils.formatDate(post.created_at)}</span>
                    </div>
                </div>

                ${post.status === 'draft' ? `
                    <div class="alert alert-secondary p-3 mb-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
                        <div>
                            <i class="bi bi-info-circle text-info me-1"></i> <strong>Draft Post:</strong> You can edit caption/media or publish it now.
                        </div>
                        <div class="d-flex gap-2">
                            <a href="dashboard.html?edit=${post.id}" class="btn btn-sm btn-warning text-dark fw-semibold">
                                <i class="bi bi-pencil me-1"></i> Edit Draft
                            </a>
                            <button type="button" class="btn btn-sm btn-success fw-semibold" onclick="publishDraftDirectly('${post.id}')">
                                <i class="bi bi-send-check me-1"></i> Publish Now
                            </button>
                        </div>
                    </div>
                ` : ''}

                <div class="mb-3">
                    <span class="text-secondary small fw-semibold text-uppercase d-block mb-1">Caption</span>
                    <div class="p-3 bg-dark border border-secondary rounded text-white whitespace-pre-wrap small">
                        ${Utils.escapeHtml(post.caption)}
                    </div>
                </div>

                ${post.image_url ? `
                    <div class="mb-3">
                        <span class="text-secondary small fw-semibold text-uppercase d-block mb-1">Attached Media</span>
                        <a href="${Utils.escapeHtml(post.image_url)}" target="_blank">
                            <img src="${Utils.escapeHtml(post.image_url)}" class="img-fluid rounded border border-secondary" style="max-height: 250px;" alt="Post Media">
                        </a>
                    </div>
                ` : ''}

                <div class="mt-4">
                    <span class="text-secondary small fw-semibold text-uppercase d-block mb-2">Platform Publishing Breakdown</span>
                    ${platformResults || '<p class="text-muted small">No target platforms recorded.</p>'}
                </div>
            `;

            const modal = new bootstrap.Modal(document.getElementById('postDetailsModal'));
            modal.show();
        };

        window.publishDraftDirectly = async function(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            const platforms = (post.post_platforms || []).map(pp => pp.platform);
            if (platforms.length === 0) {
                UI.showToast('No target platforms assigned to this draft. Please edit the draft to select target platforms.', 'warning');
                return;
            }

            UI.showToast('Initiating publishing for draft...', 'info', 'Publishing');

            try {
                // Update post status to publishing
                await window.sb.from('posts').update({ status: 'publishing' }).eq('id', postId);

                const publishPromises = platforms.map(async (platform) => {
                    UI.showToast(`Publishing draft to ${platform.toUpperCase()}...`, 'info', platform);
                    try {
                        const { data, error } = await window.sb.functions.invoke(`publish-${platform}`, {
                            body: { post_id: postId }
                        });
                        let errMsg = null;
                        if (error) {
                            try {
                                const errBody = await error.context?.json();
                                errMsg = errBody?.error || error.message;
                            } catch (_) {
                                errMsg = error.message;
                            }
                        }

                        if (!errMsg && data && data.success) {
                            UI.showToast(`Published successfully to ${platform.toUpperCase()}!`, 'success', platform);
                            return { platform, success: true };
                        } else {
                            const failureReason = errMsg || data?.error || 'Publish failed';
                            UI.showToast(`${platform.toUpperCase()} failed: ${failureReason}`, 'danger', platform);
                            return { platform, success: false, error: failureReason };
                        }
                    } catch (err) {
                        UI.showToast(`${platform.toUpperCase()} publishing error: ${err.message || err}`, 'danger', platform);
                        return { platform, success: false };
                    }
                });

                const results = await Promise.all(publishPromises);
                const anySuccess = results.some(r => r.success);
                const allSuccess = results.every(r => r.success);
                const finalStatus = allSuccess ? 'published' : (anySuccess ? 'published' : 'failed');

                await window.sb.from('posts').update({ status: finalStatus }).eq('id', postId);

                const modalEl = document.getElementById('postDetailsModal');
                const modal = bootstrap.Modal.getInstance(modalEl);
                if (modal) modal.hide();

                await fetchAndRenderPosts();
            } catch (err) {
                UI.showToast(`Publish failed: ${err.message || err}`, 'danger', 'Error');
            }
        };

        window.retryPlatformPublish = async function(postId, platform) {
            const pName = Utils.getPlatformConfig(platform).name;
            UI.showToast(`Retrying publication to ${pName}...`, 'info', 'Retry');
            try {
                const { data, error } = await window.sb.functions.invoke(`publish-${platform}`, {
                    body: { post_id: postId }
                });
                if (error) throw error;
                if (data && data.success) {
                    UI.showToast(`Published successfully to ${pName}!`, 'success', 'Retry Complete');
                    const modalEl = document.getElementById('postDetailsModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();
                    await fetchAndRenderPosts();
                } else {
                    UI.showToast(`Retry error: ${data?.error || 'Publish failed'}`, 'danger', 'Retry Failed');
                }
            } catch (err) {
                console.error('Retry failed:', err);
                UI.showToast(`Retry failed: ${err.message || err}`, 'danger', 'Retry Error');
            }
        };

        window.deletePost = async function(postId) {
            if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) return;
            try {
                await Posts.deletePost(currentUser.id, postId);
                UI.showToast('Post deleted.', 'info');
                await fetchAndRenderPosts();
            } catch (err) {
                UI.showAlert('posts-alert-container', err.message);
            }
        };
    </script>
</body>
</html>

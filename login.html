<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - PostPilot</title>
    <!-- CDN Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container" style="max-width: 440px;">
        <!-- Brand Header -->
        <div class="text-center mb-4">
            <h1 class="h2 brand-text fw-bold mb-1"><i class="bi bi-send-fill me-2"></i>PostPilot</h1>
            <p class="text-secondary small">Direct Multi-Platform Social Media Publishing</p>
        </div>

        <!-- Auth Card -->
        <div class="card card-postpilot">
            <div class="card-header card-header-postpilot border-0 p-0">
                <ul class="nav nav-tabs nav-justified border-0" id="authTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-semibold text-white py-3 border-0" id="login-tab" data-bs-toggle="tab" data-bs-target="#login-pane" type="button" role="tab">Sign In</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-semibold text-white py-3 border-0" id="signup-tab" data-bs-toggle="tab" data-bs-target="#signup-pane" type="button" role="tab">Create Account</button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4">
                <!-- Alert Feedback Container -->
                <div id="auth-alert"></div>

                <div class="tab-content" id="authTabContent">
                    <!-- SIGN IN FORM -->
                    <div class="tab-pane fade show active" id="login-pane" role="tabpanel" tabindex="0">
                        <form id="form-login" novalidate>
                            <div class="mb-3">
                                <label for="login-email" class="form-label text-secondary small fw-medium">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="login-password" class="form-label text-secondary small fw-medium">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" id="btn-login" class="btn btn-postpilot-primary w-100 py-2">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>
                        </form>
                    </div>

                    <!-- SIGN UP FORM -->
                    <div class="tab-pane fade" id="signup-pane" role="tabpanel" tabindex="0">
                        <form id="form-signup" novalidate>
                            <div class="mb-3">
                                <label for="signup-name" class="form-label text-secondary small fw-medium">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="signup-name" placeholder="John Doe" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="signup-email" class="form-label text-secondary small fw-medium">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="signup-email" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="signup-password" class="form-label text-secondary small fw-medium">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="signup-password" placeholder="At least 6 characters" minlength="6" required>
                                </div>
                            </div>
                            <button type="submit" id="btn-signup" class="btn btn-postpilot-primary w-100 py-2">
                                <i class="bi bi-person-plus me-2"></i>Create Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small">&copy; 2026 PostPilot. All social platform calls are executed server-side via Supabase Edge Functions.</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Guard: redirect if already logged in
            await Auth.redirectIfAuthenticated();

            const formLogin = document.getElementById('form-login');
            const formSignup = document.getElementById('form-signup');

            // Handle Login
            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();
                UI.clearAlert('auth-alert');

                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;

                if (!email || !password) {
                    UI.showAlert('auth-alert', 'Please fill in both email and password.');
                    return;
                }

                const btnLogin = document.getElementById('btn-login');
                UI.setLoading(btnLogin, true, 'Signing In...');

                try {
                    await Auth.signIn(email, password);
                    UI.showToast('Login successful! Redirecting...', 'success', 'Welcome');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                } catch (err) {
                    UI.setLoading(btnLogin, false);
                    UI.showAlert('auth-alert', err.message || 'Failed to sign in. Please check your credentials.');
                }
            });

            // Handle Signup
            formSignup.addEventListener('submit', async (e) => {
                e.preventDefault();
                UI.clearAlert('auth-alert');

                const name = document.getElementById('signup-name').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const password = document.getElementById('signup-password').value;

                if (!name || !email || !password) {
                    UI.showAlert('auth-alert', 'Please complete all required fields.');
                    return;
                }

                if (password.length < 6) {
                    UI.showAlert('auth-alert', 'Password must be at least 6 characters long.');
                    return;
                }

                const btnSignup = document.getElementById('btn-signup');
                UI.setLoading(btnSignup, true, 'Creating Account...');

                try {
                    const data = await Auth.signUp(email, password, name);
                    UI.setLoading(btnSignup, false);
                    
                    if (data.session) {
                        UI.showToast('Account created successfully!', 'success', 'Welcome');
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        UI.showAlert('auth-alert', 'Account created! Please check your email inbox to confirm your email before signing in.', 'info');
                    }
                } catch (err) {
                    UI.setLoading(btnSignup, false);
                    UI.showAlert('auth-alert', err.message || 'Sign up failed.');
                }
            });
        });
    </script>
</body>
</html>

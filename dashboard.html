<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PostPilot</title>
    <!-- CDN Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-postpilot sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
                <i class="bi bi-send-fill text-primary"></i>
                <span class="brand-text fw-bold fs-4">PostPilot</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link active fw-medium" href="dashboard.html"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="posts.html"><i class="bi bi-file-earmark-post me-1"></i> Posts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium" href="settings.html"><i class="bi bi-gear me-1"></i> Social Settings</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span id="user-display-name" class="text-secondary small d-none d-sm-inline">...</span>
                    <button id="btn-logout" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <div class="container py-4">

        <!-- Top Greeting Banner -->
        <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0">Publish Dashboard</h2>
                <p class="text-secondary small mb-0">Create once, publish directly across platforms.</p>
            </div>
            <div>
                <a href="#create-post-card" class="btn btn-postpilot-primary btn-sm">
                    <i class="bi bi-plus-lg me-1"></i> New Post
                </a>
            </div>
        </div>

        <!-- STAT METRICS ROW -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div>
                        <div class="text-secondary small text-uppercase fw-semibold">Total Posts</div>
                        <div id="stat-total" class="fs-3 fw-bold mt-1">0</div>
                    </div>
                    <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                        <i class="bi bi-collection"></i>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div>
                        <div class="text-secondary small text-uppercase fw-semibold">Published</div>
                        <div id="stat-published" class="fs-3 fw-bold text-success mt-1">0</div>
                    </div>
                    <div class="stat-icon bg-success bg-opacity-10 text-success">
                        <i class="bi bi-check-circle"></i>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div>
                        <div class="text-secondary small text-uppercase fw-semibold">Drafts</div>
                        <div id="stat-drafts" class="fs-3 fw-bold text-secondary mt-1">0</div>
                    </div>
                    <div class="stat-icon bg-secondary bg-opacity-10 text-secondary">
                        <i class="bi bi-pencil"></i>
                    </div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="stat-card">
                    <div>
                        <div class="text-secondary small text-uppercase fw-semibold">Failed</div>
                        <div id="stat-failed" class="fs-3 fw-bold text-danger mt-1">0</div>
                    </div>
                    <div class="stat-icon bg-danger bg-opacity-10 text-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- CREATE POST COLUMN -->
            <div class="col-lg-7">
                <div id="create-post-card" class="card card-postpilot">
                    <div class="card-header card-header-postpilot d-flex align-items-center justify-content-between">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2 text-primary"></i>What's on your mind?</h5>
                        <span class="badge bg-secondary">MVP Publisher</span>
                    </div>
                    <div class="card-body p-4">
                        <div id="post-alert-container"></div>

                        <form id="form-create-post">
                            <!-- CAPTION -->
                            <div class="mb-3">
                                <label for="post-caption" class="form-label text-secondary small fw-medium">Caption / Text Content <span class="text-danger">*</span></label>
                                <textarea id="post-caption" class="form-control" rows="4" placeholder="Write your post caption here..." required></textarea>
                            </div>

                            <!-- IMAGE ATTACHMENT SECTION -->
                            <div class="mb-4">
                                <label class="form-label text-secondary small fw-medium d-block">Image (Optional, max 10 MB)</label>
                                
                                <div id="image-select-area">
                                    <input type="file" id="post-image-file" class="d-none" accept="image/jpeg,image/jpg,image/png,image/webp">
                                    <button type="button" id="btn-select-image" class="btn btn-outline-secondary w-100 border-dashed py-3">
                                        <i class="bi bi-image fs-4 d-block mb-1 text-primary"></i>
                                        <span>Add Image (JPG, PNG, WEBP)</span>
                                    </button>
                                </div>

                                <!-- IMAGE PREVIEW BOX -->
                                <div id="image-preview-area" class="d-none mt-2 position-relative">
                                    <div class="card bg-dark border-secondary p-2 d-flex flex-row align-items-center gap-3">
                                        <img id="preview-img-element" src="" alt="Preview" class="rounded object-fit-cover" style="width: 70px; height: 70px;">
                                        <div class="flex-grow-1 overflow-hidden">
                                            <div id="preview-file-name" class="fw-medium text-truncate small">filename.png</div>
                                            <div id="preview-file-size" class="text-secondary extra-small">0 MB</div>
                                        </div>
                                        <button type="button" id="btn-remove-image" class="btn btn-outline-danger btn-sm me-1">
                                            <i class="bi bi-trash me-1"></i> Remove
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- PLATFORM SELECTOR -->
                            <div class="mb-4">
                                <label class="form-label text-secondary small fw-medium d-block mb-2">Target Platforms</label>
                                
                                <!-- Platform Connection Warning Container -->
                                <div id="platform-warning-container"></div>

                                <div class="row g-2" id="platform-checkboxes">
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check card-postpilot p-2 px-3 m-0 d-flex align-items-center gap-2">
                                            <input class="form-check-input platform-checkbox mt-0" type="checkbox" value="telegram" id="chk-telegram" checked>
                                            <label class="form-check-label text-white cursor-pointer d-flex align-items-center gap-2" for="chk-telegram">
                                                <i class="bi bi-telegram text-info"></i> Telegram
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check card-postpilot p-2 px-3 m-0 d-flex align-items-center gap-2 opacity-75">
                                            <input class="form-check-input platform-checkbox mt-0" type="checkbox" value="facebook" id="chk-facebook">
                                            <label class="form-check-label text-white cursor-pointer d-flex align-items-center gap-2" for="chk-facebook">
                                                <i class="bi bi-facebook text-primary"></i> Facebook
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check card-postpilot p-2 px-3 m-0 d-flex align-items-center gap-2 opacity-75">
                                            <input class="form-check-input platform-checkbox mt-0" type="checkbox" value="instagram" id="chk-instagram">
                                            <label class="form-check-label text-white cursor-pointer d-flex align-items-center gap-2" for="chk-instagram">
                                                <i class="bi bi-instagram text-danger"></i> Instagram
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check card-postpilot p-2 px-3 m-0 d-flex align-items-center gap-2 opacity-75">
                                            <input class="form-check-input platform-checkbox mt-0" type="checkbox" value="linkedin" id="chk-linkedin">
                                            <label class="form-check-label text-white cursor-pointer d-flex align-items-center gap-2" for="chk-linkedin">
                                                <i class="bi bi-linkedin text-info"></i> LinkedIn
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-6 col-sm-4">
                                        <div class="form-check card-postpilot p-2 px-3 m-0 d-flex align-items-center gap-2 opacity-75">
                                            <input class="form-check-input platform-checkbox mt-0" type="checkbox" value="x" id="chk-x">
                                            <label class="form-check-label text-white cursor-pointer d-flex align-items-center gap-2" for="chk-x">
                                                <i class="bi bi-twitter-x text-white"></i> X (Twitter)
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- ACTION BUTTONS -->
                            <div class="d-flex gap-3 pt-2">
                                <button type="button" id="btn-save-draft" class="btn btn-outline-secondary w-50 py-2 fw-semibold">
                                    <i class="bi bi-bookmark me-1"></i> Save Draft
                                </button>
                                <button type="submit" id="btn-publish-now" class="btn btn-postpilot-primary w-50 py-2">
                                    <i class="bi bi-send-check-fill me-1"></i> Publish
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RECENT ACTIVITY / POSTS COLUMN -->
            <div class="col-lg-5">
                <div class="card card-postpilot h-100">
                    <div class="card-header card-header-postpilot d-flex align-items-center justify-content-between">
                        <h5 class="mb-0 fw-bold"><i class="bi bi-clock-history me-2 text-primary"></i>Recent Posts</h5>
                        <a href="posts.html" class="small text-decoration-none text-primary fw-medium">View All &rarr;</a>
                    </div>
                    <div class="card-body p-0">
                        <div id="recent-posts-list" class="list-group list-group-flush border-0">
                            <!-- JS populates recent posts -->
                            <div class="p-4 text-center text-secondary">
                                <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                                <p class="mb-0 extra-small">Loading recent posts...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.1/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/platforms.js"></script>
    <script src="js/posts.js"></script>
    <script>
        let currentUser = null;
        let userAccounts = [];
        let selectedFile = null;
        let removeExistingImage = false;
        let editingPostId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await Auth.requireAuth();
            if (!currentUser) return;

            document.getElementById('user-display-name').textContent = currentUser.email;
            document.getElementById('btn-logout').addEventListener('click', () => Auth.signOut());

            userAccounts = await Platforms.getUserAccounts(currentUser.id);
            validatePlatformConnections();

            await loadDashboardData();

            // Check if editing existing post via ?edit=POST_ID or reusing via ?reuse=POST_ID
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit');
            const reuseId = urlParams.get('reuse');

            if (editId) {
                await loadPostForEditing(editId);
            } else if (reuseId) {
                await loadPostForReuse(reuseId);
            }

            // Image Selector & Preview Logic
            const btnSelectImg = document.getElementById('btn-select-image');
            const fileInput = document.getElementById('post-image-file');
            const btnRemoveImg = document.getElementById('btn-remove-image');
            const imgPreviewArea = document.getElementById('image-preview-area');
            const imgSelectArea = document.getElementById('image-select-area');

            btnSelectImg.addEventListener('click', () => fileInput.click());

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const validation = Storage.validateImage(file);
                if (!validation.valid) {
                    UI.showAlert('post-alert-container', validation.message, 'danger');
                    fileInput.value = '';
                    return;
                }

                selectedFile = file;
                removeExistingImage = false;
                document.getElementById('preview-file-name').textContent = file.name;
                document.getElementById('preview-file-size').textContent = `${(file.size / (1024 * 1024)).toFixed(2)} MB`;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    document.getElementById('preview-img-element').src = evt.target.result;
                    imgSelectArea.classList.add('d-none');
                    imgPreviewArea.classList.remove('d-none');
                };
                reader.readAsDataURL(file);
            });

            btnRemoveImg.addEventListener('click', () => {
                selectedFile = null;
                removeExistingImage = true;
                fileInput.value = '';
                imgSelectArea.classList.remove('d-none');
                imgPreviewArea.classList.add('d-none');
            });

            // Platform checkbox change listener
            document.querySelectorAll('.platform-checkbox').forEach(chk => {
                chk.addEventListener('change', validatePlatformConnections);
            });

            // Form Submit: Save Draft
            document.getElementById('btn-save-draft').addEventListener('click', async () => {
                await handlePostSubmit(false);
            });

            // Form Submit: Publish Now
            document.getElementById('form-create-post').addEventListener('submit', async (e) => {
                e.preventDefault();
                await handlePostSubmit(true);
            });
        });

        async function loadPostForEditing(postId) {
            const post = await Posts.getPostById(currentUser.id, postId);
            if (!post) {
                UI.showAlert('post-alert-container', 'Draft post not found.', 'warning');
                return;
            }

            editingPostId = post.id;
            document.getElementById('post-caption').value = post.caption;

            // Load attached image if present
            if (post.image_url) {
                document.getElementById('preview-img-element').src = post.image_url;
                document.getElementById('preview-file-name').textContent = 'Attached Image';
                document.getElementById('preview-file-size').textContent = 'Saved in Storage';
                document.getElementById('image-select-area').classList.add('d-none');
                document.getElementById('image-preview-area').classList.remove('d-none');
            }

            // Check platforms
            const activePlatforms = (post.post_platforms || []).map(p => p.platform);
            document.querySelectorAll('.platform-checkbox').forEach(chk => {
                chk.checked = activePlatforms.includes(chk.value);
            });

            // Change Header to Edit Mode
            const cardHeader = document.querySelector('#create-post-card .card-header h5');
            if (cardHeader) {
                cardHeader.innerHTML = `<i class="bi bi-pencil-square me-2 text-warning"></i>Editing Draft Post <a href="dashboard.html" class="btn btn-sm btn-outline-secondary ms-3">Cancel Edit</a>`;
            }
            UI.showToast('Draft post loaded for editing.', 'info', 'Editing');
        }

        async function loadPostForReuse(postId) {
            const post = await Posts.getPostById(currentUser.id, postId);
            if (!post) {
                UI.showAlert('post-alert-container', 'Post not found.', 'warning');
                return;
            }

            // Fill in caption only — this is a brand new post, not linked to the original
            document.getElementById('post-caption').value = post.caption;

            // Pre-load image preview if original had an image (no new upload, just visual hint)
            if (post.image_url) {
                document.getElementById('preview-img-element').src = post.image_url;
                document.getElementById('preview-file-name').textContent = 'Original image (attach a new one to replace)';
                document.getElementById('preview-file-size').textContent = 'From previous post';
                document.getElementById('image-select-area').classList.add('d-none');
                document.getElementById('image-preview-area').classList.remove('d-none');
                // Note: selectedFile stays null — user must re-attach image if they want it uploaded
            }

            // Restore previously selected platforms
            const activePlatforms = (post.post_platforms || []).map(p => p.platform);
            document.querySelectorAll('.platform-checkbox').forEach(chk => {
                chk.checked = activePlatforms.includes(chk.value);
            });

            // Update header to indicate reuse mode (NOT edit mode)
            const cardHeader = document.querySelector('#create-post-card .card-header h5');
            if (cardHeader) {
                cardHeader.innerHTML = `<i class="bi bi-arrow-repeat me-2 text-success"></i>Reusing Published Post — New Draft <a href="dashboard.html" class="btn btn-sm btn-outline-secondary ms-3">Cancel</a>`;
            }

            UI.showToast('Published post content loaded. This will create a brand new post.', 'success', 'Reuse Mode');
        }

        function validatePlatformConnections() {
            const connectedPlatforms = userAccounts.map(a => a.platform);
            const selectedPlatforms = Array.from(document.querySelectorAll('.platform-checkbox:checked')).map(c => c.value);
            const warningContainer = document.getElementById('platform-warning-container');
            warningContainer.innerHTML = '';

            const missing = selectedPlatforms.filter(p => !connectedPlatforms.includes(p));

            if (missing.length > 0) {
                const missingNames = missing.map(p => Utils.getPlatformConfig(p).name).join(', ');
                warningContainer.innerHTML = `
                    <div class="alert alert-warning py-2 px-3 extra-small mb-3 d-flex align-items-center gap-2">
                        <i class="bi bi-exclamation-triangle-fill fs-6"></i>
                        <div>
                            <strong>Connection Required:</strong> ${missingNames} ${missing.length === 1 ? 'is' : 'are'} not connected.
                            <a href="settings.html" class="alert-link">Connect in Settings &rarr;</a>
                        </div>
                    </div>
                `;
            }
        }

        async function loadDashboardData() {
            const posts = await Posts.getUserPosts(currentUser.id, 10);
            const metrics = Posts.computeMetrics(posts);

            document.getElementById('stat-total').textContent = metrics.total;
            document.getElementById('stat-published').textContent = metrics.published;
            document.getElementById('stat-drafts').textContent = metrics.drafts;
            document.getElementById('stat-failed').textContent = metrics.failed;

            // Render Recent Posts
            const listContainer = document.getElementById('recent-posts-list');
            if (posts.length === 0) {
                listContainer.innerHTML = `
                    <div class="p-4 text-center text-secondary">
                        <i class="bi bi-inbox fs-2 d-block mb-2 opacity-50"></i>
                        <p class="mb-0">No posts created yet.</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = posts.slice(0, 5).map(post => {
                const badgeHtml = Utils.renderStatusBadge(post.status);
                const dateStr = Utils.formatDate(post.created_at);
                const captionSnippet = Utils.truncateText(post.caption, 50);

                return `
                    <div class="list-group-item bg-transparent text-white border-secondary p-3">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <span class="fw-semibold text-truncate me-2" style="max-width: 220px;">${Utils.escapeHtml(captionSnippet)}</span>
                            ${badgeHtml}
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2 extra-small text-secondary">
                            <span><i class="bi bi-clock me-1"></i>${dateStr}</span>
                            ${post.status === 'draft' || post.status === 'failed' ? `
                                <a href="dashboard.html?edit=${post.id}" class="btn btn-xs btn-outline-warning text-warning p-0 px-1 extra-small text-decoration-none">
                                    <i class="bi bi-pencil"></i> Edit
                                </a>
                            ` : post.status === 'published' ? `
                                <a href="dashboard.html?reuse=${post.id}" class="btn btn-xs btn-outline-success text-success p-0 px-1 extra-small text-decoration-none">
                                    <i class="bi bi-arrow-repeat"></i> Reuse
                                </a>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handlePostSubmit(isPublish) {
            UI.clearAlert('post-alert-container');
            const caption = document.getElementById('post-caption').value.trim();
            const selectedPlatforms = Array.from(document.querySelectorAll('.platform-checkbox:checked')).map(c => c.value);

            if (!caption) {
                UI.showAlert('post-alert-container', 'Please write a caption for your post.');
                return;
            }

            if (selectedPlatforms.length === 0) {
                UI.showAlert('post-alert-container', 'Please select at least one target platform.');
                return;
            }

            // Connection Check for publish
            if (isPublish) {
                const connectedPlatforms = userAccounts.map(a => a.platform);
                const missing = selectedPlatforms.filter(p => !connectedPlatforms.includes(p));
                if (missing.length > 0) {
                    const missingNames = missing.map(p => Utils.getPlatformConfig(p).name).join(', ');
                    UI.showAlert('post-alert-container', `${missingNames} ${missing.length === 1 ? 'is' : 'are'} not connected. Please configure your platform connection in Settings first.`);
                    return;
                }
            }

            const activeBtn = isPublish ? document.getElementById('btn-publish-now') : document.getElementById('btn-save-draft');
            UI.setLoading(activeBtn, true, isPublish ? 'Publishing...' : 'Saving...');

            try {
                let targetPost = null;

                if (editingPostId) {
                    // Update existing post
                    targetPost = await Posts.updatePost(currentUser.id, editingPostId, {
                        caption,
                        imageFile: selectedFile,
                        removeImage: removeExistingImage,
                        selectedPlatforms,
                        isPublish
                    });
                } else {
                    // Create new post
                    targetPost = await Posts.createPost(currentUser.id, {
                        caption,
                        imageFile: selectedFile,
                        selectedPlatforms,
                        isPublish
                    });
                }

                if (isPublish) {
                    // Trigger Edge Function Publishing for each selected platform
                    for (const platform of selectedPlatforms) {
                        const functionName = `publish-${platform}`;
                        UI.showToast(`Triggering ${platform.toUpperCase()} Edge Function...`, 'info', platform);
                        try {
                            const { data: resData, error: resError } = await window.sb.functions.invoke(functionName, {
                                body: { post_id: targetPost.id }
                            });
                            if (resError) throw resError;
                            if (resData && resData.success) {
                                UI.showToast(`Published successfully to ${platform.toUpperCase()}!`, 'success', platform);
                            } else {
                                UI.showToast(`${platform.toUpperCase()} error: ${resData?.error || 'Publish failed'}`, 'danger', platform);
                            }
                        } catch (edgeErr) {
                            console.error(`${platform} Edge Function Error:`, edgeErr);
                            UI.showToast(`${platform.toUpperCase()} publishing error: ${edgeErr.message || edgeErr}`, 'danger', `${platform.toUpperCase()} Failure`);
                        }
                    }
                } else {
                    UI.showToast(editingPostId ? 'Draft updated successfully!' : 'Draft saved successfully!', 'success', 'Saved');
                }

                // Reset form & state
                editingPostId = null;
                selectedFile = null;
                removeExistingImage = false;
                document.getElementById('post-caption').value = '';
                document.getElementById('btn-remove-image').click();
                UI.setLoading(activeBtn, false);

                // Reset URL if editing
                if (window.history.replaceState) {
                    window.history.replaceState(null, null, window.location.pathname);
                }

                // Reload Data
                await loadDashboardData();

            } catch (err) {
                UI.setLoading(activeBtn, false);
                UI.showAlert('post-alert-container', err.message || 'An error occurred while saving the post.');
            }
        }
    </script>
</body>
</html>
